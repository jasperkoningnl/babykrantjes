name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  content-database:
    runs-on: ubuntu-latest
    services:
      postgrest:
        image: postgrest/postgrest:v13.0.7
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/babykrant_content_test
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: local-test-only-secret-at-least-32-characters
        ports:
          - 3001:3000
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: babykrant_content_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Migration, privileges and concurrent worker tests
        run: npm test -- tests/content-library-db.test.ts
        env:
          CONTENT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/babykrant_content_test
          CONTENT_TEST_REST_URL: http://localhost:3001
          CONTENT_TEST_JWT_SECRET: local-test-only-secret-at-least-32-characters

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (parsers met HTML-fixtures)
        run: npm test

      - name: Build
        run: npm run build
